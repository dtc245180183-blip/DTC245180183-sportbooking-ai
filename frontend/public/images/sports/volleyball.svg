  <line x1="101" y1="108" x2="101" y2="120" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
  <line x1="134" y1="108" x2="134" y2="120" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
  <line x1="167" y1="108" x2="167" y2="120" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
  <line x1="200" y1="108" x2="200" y2="120" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
  <line x1="233" y1="108" x2="233" y2="120" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
  <line x1="266" y1="108" x2="266" y2="120" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
  <line x1="299" y1="108" x2="299" y2="120" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
  <line x1="332" y1="108" x2="332" y2="120" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>

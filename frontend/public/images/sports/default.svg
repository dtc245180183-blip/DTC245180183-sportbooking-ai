<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f1a30"/>
    </linearGradient>
    <linearGradient id="glow" x1="200" y1="0" x2="200" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.2"/><stop offset="100%" stop-color="#64748b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bg)"/>
  <rect width="400" height="225" fill="url(#glow)"/>
  <!-- Generic sport court with question mark center -->
  <rect x="45" y="40" width="310" height="148" rx="8" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8,5"/>
  <!-- Center circle -->
  <circle cx="200" cy="114" r="35" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- Lines -->
  <line x1="200" y1="40" x2="200" y2="188" stroke="#64748b" stroke-width="1.5" opacity="0.6"/>
  <line x1="45" y1="114" x2="355" y2="114" stroke="#64748b" stroke-width="1.5" opacity="0.6"/>
  <!-- Trophy / award icon center -->
  <path d="M185 95 L215 95 L213 115 Q210 122 200 122 Q190 122 187 115 Z" fill="rgba(100,116,139,0.3)" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="200" y1="122" x2="200" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <rect x="192" y="130" width="16" height="4" rx="2" fill="#94a3b8"/>
  <!-- Handles -->
  <path d="M185 100 Q178 100 178 108 Q178 116 185 116" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M215 100 Q222 100 222 108 Q222 116 215 116" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Stars -->
  <text x="160" y="80" fill="#64748b" font-size="14" opacity="0.5">⭐</text>
  <text x="225" y="80" fill="#64748b" font-size="14" opacity="0.5">⭐</text>
  <!-- Label -->
  <rect x="148" y="196" width="104" height="22" rx="11" fill="rgba(100,116,139,0.15)" stroke="rgba(100,116,139,0.3)" stroke-width="1"/>
  <text x="200" y="211" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Sân Thể Thao</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="200" y1="0" x2="200" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bg)"/>
  <rect width="400" height="225" fill="url(#glow)"/>
  <!-- Court outline -->
  <rect x="40" y="35" width="320" height="155" rx="4" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
  <!-- Net posts -->
  <line x1="40" y1="90" x2="40" y2="145" stroke="#a78bfa" stroke-width="3"/>
  <line x1="360" y1="90" x2="360" y2="145" stroke="#a78bfa" stroke-width="3"/>
  <!-- Net -->
  <line x1="40" y1="112" x2="360" y2="112" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="40" y1="90" x2="360" y2="90" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="40" y1="145" x2="360" y2="145" stroke="#a78bfa" stroke-width="1.5"/>
  <!-- Net mesh -->
  {Array.from({length:20}).map((_, i) =>
    `<line x1="${50 + i*16}" y1="90" x2="${50 + i*16}" y2="145" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4"/>`
  ).join('')}
  <line x1="50" y1="90" x2="50" y2="145" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4"/>
  <line x1="70" y1="90" x2="70" y2="145" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4"/>
  <line x1="90" y1="90" x2="90" y2="145" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4"/>
  <line x1="110" y1="90" x2="110" y2="145" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4"/>
  <line x1="130" y1="90" x2="130" y2="145" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4"/>
  <line x1="150" y1="90" x2="150" y2="145" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4"/>
  <line x1="170" y1="90" x2="170" y2="145" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4"/>
  <line x1="190" y1="90" x2="190" y2="145" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4"/>
  <line x1="210" y1="90" x2="210" y2="145" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4"/>
  <line x1="230" y1="90" x2="230" y2="145" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4"/>
  <line x1="250" y1="90" x2="250" y2="145" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4"/>
  <line x1="270" y1="90" x2="270" y2="145" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4"/>
  <line x1="290" y1="90" x2="290" y2="145" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4"/>
  <line x1="310" y1="90" x2="310" y2="145" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4"/>
  <line x1="330" y1="90" x2="330" y2="145" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4"/>
  <line x1="350" y1="90" x2="350" y2="145" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.4"/>
  <!-- Service boxes -->
  <line x1="40" y1="35" x2="40" y2="190" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="200" y1="35" x2="200" y2="90" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="200" y1="145" x2="200" y2="190" stroke="#a78bfa" stroke-width="1.5"/>
  <!-- Baseline marks -->
  <line x1="40" y1="62" x2="360" y2="62" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="40" y1="163" x2="360" y2="163" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <!-- Ball -->
  <circle cx="140" cy="75" r="10" fill="#f8e532" stroke="#a78bfa" stroke-width="1.5"/>
  <path d="M134 71 Q140 67 146 71" stroke="#a78bfa" stroke-width="1" fill="none"/>
  <path d="M134 79 Q140 83 146 79" stroke="#a78bfa" stroke-width="1" fill="none"/>
  <!-- Label -->
  <rect x="152" y="195" width="96" height="22" rx="11" fill="rgba(167,139,250,0.15)" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
  <text x="200" y="210" text-anchor="middle" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Sân Tennis</text>
</svg>

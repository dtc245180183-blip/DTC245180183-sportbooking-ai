<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2240"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="glow" x1="200" y1="0" x2="200" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- BG -->
  <rect width="400" height="225" fill="url(#bg)"/>
  <rect width="400" height="225" fill="url(#glow)"/>
  <!-- Field -->
  <rect x="30" y="40" width="340" height="145" rx="6" fill="#166534" opacity="0.9"/>
  <rect x="30" y="40" width="340" height="145" rx="6" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <!-- Center line -->
  <line x1="200" y1="40" x2="200" y2="185" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Center circle -->
  <circle cx="200" cy="112" r="28" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="200" cy="112" r="3" fill="#22c55e"/>
  <!-- Goal areas -->
  <rect x="30" y="84" width="50" height="56" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="320" y="84" width="50" height="56" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="30" y="95" width="25" height="34" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="345" y="95" width="25" height="34" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Ball -->
  <circle cx="200" cy="112" r="13" fill="#f8fafc" opacity="0.95"/>
  <path d="M193 104 L200 99 L207 104 L205 113 L195 113Z" fill="#1e293b" opacity="0.7"/>
  <path d="M186 115 L193 104 L195 113 L188 117Z" fill="#1e293b" opacity="0.5"/>
  <path d="M214 115 L207 104 L205 113 L212 117Z" fill="#1e293b" opacity="0.5"/>
  <!-- Label -->
  <rect x="148" y="195" width="104" height="22" rx="11" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="200" y="210" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Sân Bóng Đá</text>
</svg>
